# DSM Pipeline Configuration
# Tailored for streamlined, single-target workflow (steps 1–4, e.g. for "v0_5" modeling)

# General settings
region: "China"
soil_property: "pH"       # Target soil property (e.g. "pH", "SOC")
depth: "05"               # Depth code, e.g. "05" for 0–5cm (informative)
seed: 42                  # Random seed for reproducibility

# Directory structure
input_dir: "data"                               # Source of harmonized_soil.csv etc.
output_dir: "outputs"                           # Results and models are written here
raster_stack_dir: "Block/Forests_Raster_stack_item" # Directory of raster_stack_*.tif
scripts_dir: "scripts"                          # (optional) folder for pipeline scripts

# File naming (all key interfaces between steps set here)
combined_pattern: "harmonized_soil.csv"         # Step 2+ reads this as table input
best_feature_file: "best_features.rds"          # Step 2 output, input for 3/4
final_model_file: "v0_5_final_rf_model.rds"     # Step 3 output, input for 4
raster_stack_pattern: "^raster_stack_.*\\.tif$" # For finding raster tiles in step 4
output_prefix: "v0_5"                           # For grouping model files/outputs
response_col: "v0_5"                            # The target variable throughout

# Feature selection settings (Step 2)
frfs:
  method: "rf"            # Model: "rf", "plsr", or "cubist"
  early_stop: true
  rf_num_trees: 500
  cv_folds: 5
  categorical_vars:       # Variables treated as categorical (factor) if present
    - FT
    - Geol
    - Geomor
    - Soil

# Hyperparameter tuning (Step 3; mlr3)
tuning:
  resampling_folds: 5
  n_evals: 25
  param_search:
    mtry:
      lower: 2
      upper: null          # null = use number of features
    num.trees:
      lower: 100
      upper: 500
    min.node.size:
      lower: 3
      upper: 20

# Prediction (Step 4)
prediction:
  quantiles: [0.05, 0.5, 0.95]           # Lower/median/upper (adjust as model supports)
  cache_dir: "outputs/cache"             # For tiles and mosaics
  checkpoint_suffix: "_checkpoint.rds"